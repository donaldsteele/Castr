name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Explicitly exclude the Docker-gated E2E tier from the cross-OS matrix. The [E2EFact] tests already
      # self-skip unless CASTR_E2E is set and a Docker daemon is reachable, but filtering here documents
      # intent and guarantees the main matrix never attempts container-based E2E (which needs Linux-native
      # Docker bridge networking + tc/iproute2, unavailable/unreliable on hosted macOS & Windows runners).
      - name: Test (unit + loopback multicast integration)
        run: dotnet test --no-build --configuration Release --filter "Category!=E2E" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  # Docker-gated Testcontainers E2E fan-out tier (tests/Castr.Core.E2ETests). Runs on ubuntu-latest ONLY:
  # the suite drives the shipped castr binary across real Docker containers on a multicast-capable bridge
  # and injects real kernel packet loss via `tc qdisc ... netem`, all of which needs Linux-native Docker
  # (GitHub-hosted macOS/Windows runners have no reliable Docker bridge networking). This is a SEPARATE job,
  # not a dependency of build-and-test, so a slow/flaky container run never blocks or gates the fast matrix.
  # It runs on the same events as the matrix (pushes to main and PRs targeting main) so container fan-out is
  # validated before merge; ubuntu-latest ships Docker preinstalled, and Testcontainers grants NET_ADMIN to
  # the containers for tc netem.
  e2e-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (Docker container fan-out E2E)
        env:
          CASTR_E2E: "1"
        run: dotnet test --no-build --configuration Release --filter "Category=E2E" tests/Castr.Core.E2ETests --logger "trx" --results-directory TestResults

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-docker
          path: TestResults

  # Produces downloadable, self-contained per-platform zips of Castr.Cli and Castr.Gui.Desktop. Only on
  # pushes to main (not PRs) so ordinary PR CI stays fast/cheap; gated on both the cross-OS matrix and the
  # E2E fan-out tier passing first, so nothing is packaged from a build that didn't actually work. All five
  # RIDs are published from a single ubuntu-latest runner: self-contained `dotnet publish` resolves the
  # target runtime (and, for Castr.Gui.Desktop, Avalonia's native Skia/HarfBuzz assets) as ordinary
  # RID-specific NuGet packages, so cross-publishing win-x64/win-arm64/osx-x64/osx-arm64 from Linux is
  # standard practice and needs no per-OS runner. Not single-file (`PublishSingleFile`) — Avalonia hasn't
  # been validated against single-file publishing in this project (see wiki/synthesis/roadmap.md's Native
  # AOT open item), so each zip contains the full publish output folder (exe + dependency DLLs + native
  # assets) rather than one bundled executable. macOS builds are unsigned/unnotarized zips, not distributable
  # .app bundles or DMGs — real macOS release packaging is M5 scope, not this CI convenience artifact.
  package:
    name: Package (${{ matrix.rid }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build-and-test, e2e-docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Castr.Cli (${{ matrix.rid }})
        run: >
          dotnet publish src/Castr.Cli/Castr.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}/castr-cli

      - name: Publish Castr.Gui.Desktop (${{ matrix.rid }})
        run: >
          dotnet publish src/Castr.Gui.Desktop/Castr.Gui.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}/castr-gui

      - name: Zip published output
        working-directory: publish/${{ matrix.rid }}
        run: |
          zip -r "../../castr-cli-${{ matrix.rid }}.zip" castr-cli
          zip -r "../../castr-gui-${{ matrix.rid }}.zip" castr-gui

      - name: Upload Castr.Cli zip
        uses: actions/upload-artifact@v4
        with:
          name: castr-cli-${{ matrix.rid }}
          path: castr-cli-${{ matrix.rid }}.zip

      - name: Upload Castr.Gui.Desktop zip
        uses: actions/upload-artifact@v4
        with:
          name: castr-gui-${{ matrix.rid }}
          path: castr-gui-${{ matrix.rid }}.zip
